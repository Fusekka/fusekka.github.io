baseURL = 'https://fusekka.com/'
languageCode = 'ja'
hasCJKLanguage = true
title = 'ふせっかのジャンク修理ブログ'
theme = "github.com/adityatelange/hugo-PaperMod"

[pagination]
  pagerSize = 5

enableRobotsTXT = true

[markup.goldmark.renderer]
  unsafe = true

[module]
  [[module.imports]]
    path = "github.com/adityatelange/hugo-PaperMod"

[params]
    defaultTheme = "light"
    disableThemeToggle = true
    author = "Fusekka"
    ShowReadingTime = true
    ShowShareButtons = true
    ShowBreadCrumbs = true
    description = "世界中のジャンク修理・魔改造DIYを眺めるのが好きな逸般人のブログ。海外掲示板などで見つけたヤバい修理事例や、クスッと笑えるDIYハックを日本語でまとめています。"

    copyright = '© 2026 ふせっかのジャンク修理ブログ · <a href="/privacy/" style="color: gray; text-decoration: underline;">プライバシーポリシー・免責事項</a>'

    customFontFace = "Inter:wght@400;600;800&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap"

    [params.assets]
        favicon = "/favicon.ico"
        favicon16x16 = "/favicon.ico"
        favicon32x32 = "/favicon.ico"
        apple_touch_icon = "/favicon.ico"

[params.homeInfoParams]
        Content = """
<div class="profile-card-container">
  <div class="profile-main-row">
    <img class="profile-avatar" src="/profile.jpg" alt="Fusekka">
    <div class="profile-bio-text">
      世界中のジャンク修理・魔改造DIYを眺めるのが好きな逸般人のブログ。<br>
      海外掲示板などで見つけたヤバい修理事例や、クスッと笑えるDIYハックを日本語でまとめています。<br>
      <span class="profile-amazon-note">当ブログはAmazonのアソシエイトとして適格販売により収入を得ています。また、プロモーションが含まれています</span>
    </div>
  </div>
  <div class="profile-action-row" style="text-align: center; margin-top: 10px;">
    <a href="/posts" style="display: inline-block; padding: 8px 24px; background: #33ccff; color: #1d1d1f !important; border-radius: 8px; text-decoration: none !important; border-bottom: none !important; box-shadow: none !important; font-weight: bold; font-size: 0.95rem;">記事を見る</a>
  </div>
</div>
"""

[[menu.main]]
    identifier = "posts"
    name = "記事一覧"
    url = "/posts/"
    weight = 5
[[menu.main]]
    identifier = "search"
    name = "記事検索"
    url = "/search/"
    weight = 10
[[menu.main]]
    identifier = "categories"
    name = "カテゴリ"
    url = "/categories/"
    weight = 20
[[menu.main]]
    identifier = "tags"
    name = "タグ一覧"
    url = "/tags/"
    weight = 30
[[menu.main]]
    identifier = "contact"
    name = "お問い合わせ"
    url = "/contact/"
    weight = 40

[outputs]
    home = ["HTML", "RSS", "JSON"]

[permalinks]
    posts = "/:slug/"