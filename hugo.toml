baseURL = 'https://fusekka.com/'
languageCode = 'ja'
hasCJKLanguage = true
title = 'ふせっかのジャンク修理ブログ'
theme = "github.com/adityatelange/hugo-PaperMod"

[pagination]
  pagerSize = 5

enableRobotsTXT = true

[markup.goldmark.renderer]
  unsafe = true

[module]
  [[module.imports]]
    path = "github.com/adityatelange/hugo-PaperMod"

[params]
    defaultTheme = "light"
    disableThemeToggle = true
    author = "Fusekka"
    ShowReadingTime = true
    ShowShareButtons = true
    ShowBreadCrumbs = true
    description = "世界中のジャンク修理・魔改造DIYを眺めるのが好きな逸般人のブログ。海外掲示板などで見つけたヤバい修理事例や、クスッと笑えるDIYハックを日本語でまとめています。"

    customFontFace = "Inter:wght@400;600;800&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap"

    [params.assets]
        favicon = "/favicon.ico"
        favicon16x16 = "/favicon.ico"
        favicon32x32 = "/favicon.ico"
        apple_touch_icon = "/favicon.ico"


    
    [[params.socialIcons]]
        name = "x"
        url = "https://x.com/Fusekka"


    [params.homeInfoParams]
        # 自己紹介文（PCで横並び、スマホでコンパクト縦並びにする設計）
        Content = """
<div class="profile-card-container">
    <div class="profile-main-row">
        <img class="profile-avatar" src="/profile.jpg" alt="Fusekka">
        <div class="profile-bio-text">
            世界中のジャンク修理・魔改造DIYを眺めるのが好きな逸般人のブログ。<br>
            海外掲示板などで見つけたヤバい修理事例や、クスッと笑えるDIYハックを日本語でまとめています。<br>
            <span class="profile-amazon-note">当ブログはAmazonのアソシエイトとして適格販売により収入を得ています。また、プロモーションが含まれています</span>
        </div>
    </div>
    
    <div class="profile-action-row">
        <a href="/posts" class="btn-view-posts">記事を見る</a>
    </div>
</div>
"""

<div style="display: flex; gap: 10px; justify-content: center;">
    <a href="/posts" style="padding: 8px 16px; background: var(--tertiary); color: var(--primary); border-radius: 8px; text-decoration: none; font-weight: bold; transition: background 0.3s;">
        記事を見る
    </a>
<!--    <a href="/posts/tools" style="padding: 8px 16px; background: var(--tertiary); color: var(--primary); border-radius: 8px; text-decoration: none; font-weight: bold; transition: background 0.3s;">
        愛用ツールを見る
    </a>
-->
</div>
"""

[[menu.main]]
    identifier = "posts"
    name = "記事一覧"
    url = "/posts/"
    weight = 5
[[menu.main]]
    identifier = "search"
    name = "記事検索"
    url = "/search/"
    weight = 10
[[menu.main]]
    identifier = "categories"
    name = "カテゴリ"
    url = "/categories/"
    weight = 20
[[menu.main]]
    identifier = "tags"
    name = "タグ一覧"
    url = "/tags/"
    weight = 30
[[menu.main]]
    identifier = "contact"
    name = "お問い合わせ"
    url = "/contact/"
    weight = 40

[outputs]
    home = ["HTML", "RSS", "JSON"]

[permalinks]
    posts = "/:slug/"
