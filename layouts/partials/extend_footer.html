<!-- ============================================================
     ★自動振り分け＆ランダム抽選プログラム（安全設計）
     ============================================================ -->
<script>
document.addEventListener("DOMContentLoaded", function () {
    // --- 1. スマホ用の抽選（mobile-ad-pool からだけ選ぶ） ---
    const mobilePool = document.querySelectorAll("#mobile-ad-pool .mobile-ad-item");
    const validMobileAds = Array.from(mobilePool).filter(item => item.innerHTML.trim().length > 10);
    const mobileTarget = document.querySelector(".mobile-ad-target");
    
    if (validMobileAds.length > 0 && mobileTarget) {
        const mobileIndex = Math.floor(Math.random() * validMobileAds.length);
        mobileTarget.innerHTML = validMobileAds[mobileIndex].innerHTML;
    }

    // --- 2. PC用の抽選（pc-ad-pool からだけ選ぶ） ---
    const pcPool = document.querySelectorAll("#pc-ad-pool .pc-ad-item");
    const validPcAds = Array.from(pcPool).filter(item => item.innerHTML.trim().length > 10);
    
    if (validPcAds.length > 0) {
        // 左側の広告
        const leftIndex = Math.floor(Math.random() * validPcAds.length);
        const leftContainer = document.querySelector(".side-ad-left");
        if (leftContainer) leftContainer.innerHTML = validPcAds[leftIndex].innerHTML;

        // 右側の広告（左と被らない）
        let rightIndex = Math.floor(Math.random() * validPcAds.length);
        if (validPcAds.length > 1) {
            while (rightIndex === leftIndex) {
                rightIndex = Math.floor(Math.random() * validPcAds.length);
            }
        }
        const rightContainer = document.querySelector(".side-ad-right");
        if (rightContainer) rightContainer.innerHTML = validPcAds[rightIndex].innerHTML;
    }
});
</script>
