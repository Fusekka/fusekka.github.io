<!-- 自動ランダム抽選プログラム -->
<script>
document.addEventListener("DOMContentLoaded", function () {
    const pool = document.querySelectorAll("#ad-pool .ad-item");
    // 有効な広告タグが入っているものだけを抽出
    const validAds = Array.from(pool).filter(item => item.innerHTML.trim().length > 10);
    if (validAds.length === 0) return;

    // 左側の広告をランダム抽選
    const leftIndex = Math.floor(Math.random() * validAds.length);
    const leftContainer = document.querySelector(".side-ad-left");
    if (leftContainer) {
        leftContainer.innerHTML = validAds[leftIndex].innerHTML;
    }

    // 右側の広告を抽選（広告が2つ以上あれば左と違うものを表示）
    let rightIndex = Math.floor(Math.random() * validAds.length);
    if (validAds.length > 1) {
        while (rightIndex === leftIndex) {
            rightIndex = Math.floor(Math.random() * validAds.length);
        }
    }
    const rightContainer = document.querySelector(".side-ad-right");
    if (rightContainer) {
        rightContainer.innerHTML = validAds[rightIndex].innerHTML;
    }
});
</script>
