<!-- ============================================================
     ★自動振り分け＆記事中自動挿入プログラム
     ============================================================ -->
<script>
document.addEventListener("DOMContentLoaded", function () {
    // 1. スマホ下部フロート広告（そのまま維持）
    const mobilePool = document.querySelectorAll("#mobile-ad-pool .mobile-ad-item");
    const validMobileAds = Array.from(mobilePool).filter(item => item.innerHTML.trim().length > 10);
    const mobileTarget = document.querySelector(".mobile-ad-target");
    
    if (validMobileAds.length > 0 && mobileTarget) {
        const mobileIndex = Math.floor(Math.random() * validMobileAds.length);
        mobileTarget.innerHTML = validMobileAds[mobileIndex].innerHTML;
    }

    // 2. 本文中の『3. なぜこうなった？』の直前に広告を割り込ませる（PC・スマホ両対応）
    const pcPool = document.querySelectorAll("#pc-ad-pool .pc-ad-item");
    const validAds = Array.from(pcPool).filter(item => item.innerHTML.trim().length > 10);
    
    if (validAds.length > 0) {
        // 記事本文内の全h2見出しを探索
        const headings = document.querySelectorAll(".post-content h2, article h2");
        let targetHeading = null;
        
        headings.forEach(h2 => {
            // 見出しのテキストに「なぜこうなった」または「3.」が含まれている場所を特定
            if (h2.textContent.includes("なぜこうなった") || h2.textContent.includes("3.")) {
                targetHeading = h2;
            }
        });

        // 該当見出しが見つかったら、その直前にランダム広告を自動挿入
        if (targetHeading) {
            const adContainer = document.createElement("div");
            adContainer.className = "in-article-ad";
            adContainer.style.textAlign = "center";
            adContainer.style.margin = "2.5rem 0";
            
            // 広告枠と分かる控えめなラベル
            const adLabel = document.createElement("div");
            adLabel.textContent = "スポンサーリンク";
            adLabel.style.fontSize = "11px";
            adLabel.style.color = "#888";
            adLabel.style.marginBottom = "6px";
            adContainer.appendChild(adLabel);

            // ランダムに広告を1つ選んでセット
            const randomIndex = Math.floor(Math.random() * validAds.length);
            const adContent = document.createElement("div");
            adContent.innerHTML = validAds[randomIndex].innerHTML;
            adContainer.appendChild(adContent);

            // 見出しの「直前」に差し込む
            targetHeading.parentNode.insertBefore(adContainer, targetHeading);
        }
    }
});
</script>
